name: collect

# Runs once a day; each provider decides from config/searches.yaml whether today is one of its
# run days (every_n_days) and how many calls it may spend (monthly/total budget).
on:
  schedule:
    - cron: "17 5 * * *"        # 05:17 UTC daily (06:17 Berlin in winter, 07:17 in summer)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore every_n_days schedules (budgets still apply)"
        type: boolean
        default: false
      providers:
        description: "Comma-separated subset (serpapi,ignav,travelpayouts,google_direct); empty = all"
        type: string
        default: ""
      only:
        description: "Regex on search_id; empty = all"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect prices
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          PROVIDERS: ${{ inputs.providers }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(run $FORCE)
          [ -n "$PROVIDERS" ] && args+=(--providers "$PROVIDERS")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          python -m fptracker "${args[@]}"

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit -q -m "data: run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i*5)); done
          exit 1
